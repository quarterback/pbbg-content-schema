name: Publish to npm and the MCP Registry
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Check that package.json and server.json agree
        run: |
          node -e "
          const p = require('./package.json'), s = require('./server.json');
          const k = s.packages[0];
          if (p.mcpName !== s.name) throw new Error('mcpName and server.json name differ');
          if (p.version !== s.version || p.version !== k.version) throw new Error('versions differ');
          if (p.name !== k.identifier) throw new Error('package name and identifier differ');"
      - name: Publish package to npm
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "This version is already on npm. Skipping npm publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to the MCP Registry
        run: ./mcp-publisher publish
